name: Tests

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master, develop ]

jobs:
  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Display Swift Version
      run: swift --version
      
    - name: Display Xcode Version
      run: xcodebuild -version
      
    - name: Build
      run: swift build -v
      
    - name: Run Tests
      run: swift test -v --parallel
      
    - name: Test Summary
      if: always()
      run: |
        echo "## ✅ macOS Tests" >> $GITHUB_STEP_SUMMARY
        echo "Tests completed for commit ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
  
  # `swift test` on macOS compiles out every UIKit branch (device and screen
  # context, the background-task path), so those only run here.
  # PRs only: a merge push to main was already checked on its PR, and the
  # timeout keeps a hung simulator from holding a macOS runner for hours.
  test-ios-simulator:
    name: Test on iOS Simulator
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Pick an iPhone simulator
      id: sim
      run: |
        UDID=$(xcrun simctl list devices available -j | python3 -c "
        import json, sys
        devices = json.load(sys.stdin)['devices']
        print(next(d['udid'] for runtime, ds in sorted(devices.items(), reverse=True)
                   if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')))")
        echo "udid=$UDID" >> "$GITHUB_OUTPUT"

    # No -quiet: it drops the assertion messages, leaving only a list of failing names.
    - name: Run Tests
      run: xcodebuild test -scheme MetaRouter -destination "id=${{ steps.sim.outputs.udid }}" -resultBundlePath TestResults.xcresult

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ios-simulator-test-results
        path: TestResults.xcresult
